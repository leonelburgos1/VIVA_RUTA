<div
  class="place-card"
  (click)="goToPlace()">

  <div class="image-container">

 <img
  [src]="image || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb'"
>

    <div class="rating">

      ⭐ {{ rating || 4.8 }}

    </div>

    <div class="category-badge">

      {{ category }}

    </div>

  </div>

  <div class="card-content">

    <h3>
      {{ title }}
    </h3>

    <div class="location">

      📍 {{ location }}

    </div>

    <p>
      {{ description }}
    </p>

  </div>

</div>
