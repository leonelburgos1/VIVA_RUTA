<header class="navbar">
  <div class="logo">
    <div class="logo-icon">
      
    </div>
    <div class="logo-text">
      <h2>Viva Ruta</h2>
      <span>Nariño</span>
    </div>
  </div>
  <nav>
    <a routerLink="/">
      Inicio
    </a>
    <a routerLink="/lugares">
      Lugares
    </a>

    <a routerLink="/tours">
      Tours
    </a>
  </nav>
  <div class="right-section">
    @if (currentUser$ | async; as user) {
      <button class="booking-btn" type="button">
        Mis Reservas
      </button>

      <button
        class="user-profile-btn"
        type="button"
        [routerLink]="['/perfil']"
        [attr.title]="'Ver perfil de ' + user.name"
      >
        <span class="user-avatar" aria-hidden="true">
          <lucide-angular
            [img]="UserRound"
            class="nav-icon">
          </lucide-angular>
        </span>
      </button>
    } @else {
      <div class="nav-actions">
        <a class="nav-btn nav-btn--ghost" routerLink="/registro">
          Registrarse
        </a>
        <a class="nav-btn nav-btn--solid" routerLink="/login">
          Acceder
        </a>
      </div>
    }
  </div>
</header>
