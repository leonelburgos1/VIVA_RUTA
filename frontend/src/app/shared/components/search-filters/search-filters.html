<div class="filters-container">

  <div class="search-box">
    <lucide-icon
      [img]="Search"
      class="search-icon">
    </lucide-icon>

    <input
      type="text"
      [placeholder]="searchPlaceholder"
      [(ngModel)]="searchTerm"
      (ngModelChange)="emitFilters()"
    >
  </div>

  @if (showCategoryFilter) {
    <div class="select-wrapper">
      <select
        [(ngModel)]="selectedCategory"
        (ngModelChange)="emitFilters()">
        @for (category of categories; track category.value) {
          <option [value]="category.value">
            {{ category.label }}
          </option>
        }
      </select>
      <lucide-icon
        [img]="ChevronDown"
        class="select-icon">
      </lucide-icon>
    </div>
  }

  @if (showMunicipalityFilter) {
    <div class="select-wrapper">
      <select
        [(ngModel)]="selectedMunicipality"
        (ngModelChange)="emitFilters()">
        @for (municipality of municipalityOptions; track municipality.value) {
          <option [value]="municipality.value">
            {{ municipality.label }}
          </option>
        }
      </select>
      <lucide-icon
        [img]="ChevronDown"
        class="select-icon">
      </lucide-icon>
    </div>
  }

</div>
