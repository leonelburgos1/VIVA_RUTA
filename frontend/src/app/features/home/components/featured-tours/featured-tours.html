<section class="featured-tours">

  <div class="section-header">

    <span class="section-subtitle">
    Tours Destacados
    </span>

    <p class="section-description">
    Experiencias únicas diseñadas para ti
    </p>

  </div>

  <div class="tours-grid">
    @if (loadingTours) {
      <p class="state-text">Cargando tours destacados...</p>
    } @else if (tours.length === 0) {
      <p class="state-text">Aún no hay tours disponibles.</p>
    } @else {
      @for (tour of tours; track tour.id) {
        <app-tour-card
          [id]="tour.id"
          [slug]="tour.slug"
          [title]="tour.title"
          [location]="tour.place_name"
          [description]="tour.description"
          [image]="tour.image_url || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb'"
          [price]="tour.price"
          [duration]="tour.duration"
          [spots]="tour.max_spots"
          [rating]="tour.rating"
        >
        </app-tour-card>
      }
    }

  </div>

</section>
