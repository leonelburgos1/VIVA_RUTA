<app-navbar></app-navbar>

<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Acceder a la cuenta</p>
    <h1>Bienvenido de nuevo</h1>
    <p class="description">
      Ingresa tu correo y contraseña para iniciar sesión. El estado de sesión se guarda
      en el navegador para esta demo frontend.
    </p>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      @if (feedback) {
        <p class="status-message">{{ feedback }}</p>
      }

      <div class="form-actions">
        <button class="primary-btn" type="submit" [disabled]="loginForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
        <a routerLink="/" class="secondary-link">Volver al inicio</a>
      </div>
    </form>

    <div class="footer-link">
      <span>¿Aún no tienes cuenta?</span>
      <a routerLink="/registro">Regístrate aquí</a>
    </div>
  </div>
</section>
